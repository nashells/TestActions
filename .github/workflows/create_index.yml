name: Create index file

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - docs/ArchitectureDriver/*.md
            - docs/TopLevelRequirements/*.md

jobs:
    create-index:
        runs-on: ubuntu-latest
        timeout-minutes: 3

        permissions:
            contents: write
            repository-projects: read
        
        steps:
            - name: Check out main repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.x'
            
            - name: Changed files
              id: chenged-files
              uses: tj-actions/changed-files@v45

            - name: Create index file
              env: 
                CHANGED_FILES: ${{ steps.chenged-files.outputs.all_changed_files}}
                GH_TOKEN: ${{ github.token }}
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                if echo "${CHANGED_FILES}" | grep -q '^docs/ArchitectureDriver/'; then
                  echo "Creating AD_index.md"
                  echo "# Architecture Driver Index" > docs/AD_index.md
                  for file in docs/ArchitectureDriver/*.md; do
                    echo "- [$(basename $file)]($file)" >> docs/AD_index.md
                  done
                  git add docs/AD_index.md
                fi
                if echo "${CHANGED_FILES}" | grep -q '^docs/TopLevelRequirements/'; then
                  echo "Creating TLR_index.md"
                  echo "# Top Level Requirements Index" > docs/TLR_index.md
                  for file in docs/TopLevelRequirements/*.md; do
                    echo "- [$(basename $file)]($file)" >> docs/TLR_index.md
                  done
                  git add docs/TLR_index.md
                fi
                git commit -m "Update index files" || true
                git push origin main




